    s += `<path d="M${X(0.5).toFixed(1)},${Y(0).toFixed(1)}L${od.join('L')}" class="c-obj"/>`;
    const lr = linea(cur, true);
    s += `<path d="${lr}L${X(hoy).toFixed(1)},${Y(0)}Z" class="c-area"/>`;
    if (proy != null) {                                   // proyección: sigue la forma de los últimos 3 meses
      let dp = `M${X(hoy).toFixed(1)},${Y(realFin).toFixed(1)}`;
      const base = PR.en(habHasta[hoy - 1]);
      for (let d = hoy + 1; d <= D; d++) dp += `L${X(d).toFixed(1)},${Y(realFin + (PR.en(habHasta[d - 1]) - base)).toFixed(1)}`;
      s += `<path d="${dp}" class="c-proj"/>`;
    }
  }
  s += `<path d="${linea(cur, true)}" class="c-real"/>`;
  if (realFin != null) s += `<circle cx="${X(hoy).toFixed(1)}" cy="${Y(realFin).toFixed(1)}" r="5" class="c-dot"/>`;
  [1, Math.ceil(D / 2), D].forEach((d, j) => s += `<text x="${X(d).toFixed(1)}" y="${H + T + 16}" text-anchor="${j === 0 ? 'start' : j === 2 ? 'end' : 'middle'}" class="c-axis">${esc(fechaCorta(dias[d - 1]))}</text>`);
  s += `<line id="burnCross" x1="0" x2="0" y1="${T}" y2="${T + H}" class="c-cross" visibility="hidden"/>`;
  s += `<rect x="${L}" y="0" width="${pw}" height="${H + T + B}" fill="transparent" id="burnHit"/></svg><div class="tip" id="burnTip" hidden></div>`;
  const chart = $('#burnChart'); chart.innerHTML = s;
  const hit = $('#burnHit'), cross = $('#burnCross'), tip = $('#burnTip');
  const show = ev => {
    const rect = chart.getBoundingClientRect(), px = (ev.clientX - rect.left) * (W / rect.width);
    let d = Math.max(1, Math.min(D, Math.round((px - L) / pw * D + 0.5)));
    if (sem) d = cortes.find(c => c >= d) || D;
    const xx = X(d);
    cross.setAttribute('x1', xx); cross.setAttribute('x2', xx); cross.setAttribute('visibility', 'visible');
    const r = cur[d - 1];
    let rows = r ? `<div class="tip-r"><i class="k"></i>Real <b>${fmtMetric(val(r), m)}</b></div>` : (proy != null ? `<div class="tip-r"><i class="k" style="border-top-style:dotted"></i>Proyección <b>${fmtMetric(realFin + PR.en(habHasta[d - 1]) - PR.en(habHasta[hoy - 1]), m)}</b></div>` : '');
    if (!esPrecio) rows += `<div class="tip-r" style="opacity:.8"><i class="k" style="border-top-style:dashed"></i>Objetivo ${fmtMetric(objDia[d - 1], m)}</div>`;
    prevs.forEach(x => { const q = x.arr[Math.min(d, x.arr.length) - 1]; rows += `<div class="tip-r" style="opacity:.8"><i class="k p${x.n}"></i>${esc(x.L.corto)} ${fmtMetric(val(q), m)}</div>`; });
    tip.innerHTML = `<div class="tip-d">${esc(fechaDia(dias[d - 1]))}${habil.has(dias[d - 1]) ? '' : ' · no laborable'}</div>${rows}`;
    tip.hidden = false;
    tip.style.left = Math.max(70, Math.min(rect.width - 70, (xx / W) * rect.width)) + 'px'; tip.style.top = '-6px';
  };
  const hide = () => { cross.setAttribute('visibility', 'hidden'); tip.hidden = true; };
  hit.addEventListener('pointermove', show); hit.addEventListener('pointerdown', show); hit.addEventListener('pointerleave', hide);
}

/* ---------- Brecha en cascada: vs. objetivo o vs. mes anterior ---------- */
function efectosPrev(cal) {
  // Período anterior equivalente (mes anterior o N meses antes), cortado a la misma fecha si el actual está en curso
  const prevs = esRango() ? perSelPrev() : [perAnterior(S.periodo)], hasta = corteComparable(calendario(S.periodo));
  const ok = v => esRango() ? enPrevComparable(v, prevs) : (v._p === prevs[0] && diaDe(v.fecha) <= hasta);
  const lp = new Map(); let Fp = 0;
  for (const v of DATA.ventas) {
    if (!ok(v) || !ventaOK(v) || !match(v, S.f)) continue;
    const F = v.unidades * v.precio; Fp += F;
    const k = kLinea(v), o = lp.get(k) || { f: 0, u: 0 }; o.f += F; o.u += v.unidades; lp.set(k, o);
  }
  let Fc = 0, base = 0;
  for (const v of DATA.ventas) {
    if (!enSel(v._p) || !ventaOK(v) || !match(v, S.f)) continue;
    const F = v.unidades * v.precio, o = lp.get(kLinea(v));
    Fc += F; base += o && o.u ? v.unidades * (o.f / o.u) : F;    // líneas nuevas: sin efecto precio
  }
  const p1 = prevs[0];
  if (esRango()) return { ini: Fp, vol: base - Fp, pre: Fc - base, fin: Fc, lblIni: lblPrev(), lblFin: lblSel(), p1, txtPrev: lblPrev() };
  const ult = Math.min(hasta, diasCalendario(p1).length);
  return { ini: Fp, vol: base - Fp, pre: Fc - base, fin: Fc, lblIni: `${perLabel(p1).corto} al ${ult}`, lblFin: `${perLabel(S.periodo).corto} al ${cal.closed ? diasCalendario(S.periodo).length : diaDe(IDX.corte)}`, p1, txtPrev: perLabel(p1).mes.toLowerCase() };
}
function renderEfectos(a, cal) {
  const box = $('#cFx'), vsPrev = S.fxVs === 'prev';
  let h = `<div class="card-h"><div><div class="card-t">¿Por qué la brecha?</div><div class="card-s">${vsPrev ? (esRango() ? `Facturación vs. ${esc(lblPrev())} (período anterior, a la misma fecha)` : 'Facturación vs. el mes anterior a la misma fecha') : `Facturación real vs. objetivo ${cal.closed ? 'del período' : 'a la fecha, según cómo se vendió en los últimos 3 meses'}`}</div></div></div>
    <div class="card-tools">${segMini('fxvs', S.fxVs, [['obj', 'Vs. objetivo'], ['prev', esRango() ? 'Vs. período anterior' : 'Vs. mes anterior']])}</div>`;
  if (!cal.elapsed) { box.innerHTML = h + '<div class="card-s">Sin ventas en el periodo.</div>'; return; }
  let d;
  if (vsPrev) {
    d = efectosPrev(cal);
    if (!d.ini) { box.innerHTML = h + `<div class="card-s">No hay ventas de ${esc(d.txtPrev)} para comparar.</div>`; return; }
  } else {
    // Objetivo a la fecha: meses cerrados completos + el mes en curso según la curva de los últimos 3 meses
    let objHoy = 0;
    perSel().forEach(p => { const c = calendario(p), o = esRango() ? agg(p, S.f).oF : a.oF; const prop = c.closed ? 1 : c.future || !c.elapsed ? 0 : proporcionEsperada(curvaHistorica(p, S.f), c.elapsed / c.total, 'fact'); objHoy += o * prop; });
    d = { ini: objHoy, vol: a.rFo - objHoy, pre: a.rF - a.rFo, fin: a.rF, lblIni: cal.closed ? 'Objetivo' : 'Objetivo a hoy', lblFin: 'Real' };

  const pasos = [

  box.innerHTML = h;
  const W = Math.max(260, $('#fxChart').clientWidth), H = 170, T = 24, B = 34;
  const niveles = [d.ini, d.ini + d.vol, d.fin];
  const vmin = Math.min(...niveles), vmax = Math.max(...niveles);
  // Eje recortado: los efectos suelen ser chicos frente al total; se marca el corte.
  const lo = Math.max(0, vmin - (vmax - vmin) * 1.2 - vmax * 0.04), hi = vmax + (vmax - vmin) * 0.15 + vmax * 0.01;
  const Y = v => T + (1 - (v - lo) / (hi - lo)) * H;
  const n = pasos.length, slot = W / n, bw = Math.min(54, slot * 0.56);
  let s = `<svg viewBox="0 0 ${W} ${T + H + B}" height="${T + H + B}" role="img" aria-label="Cascada de la brecha"><line x1="0" x2="${W}" y1="${T + H + 0.5}" y2="${T + H + 0.5}" class="c-grid"/>`;
  let nivel = d.ini;
  pasos.forEach((p, i) => {
    const x = i * slot + (slot - bw) / 2, cx = x + bw / 2;
    let y0, y1, cls, lbl;
    if (p.tipo === 'fx') { y0 = Y(nivel); y1 = Y(nivel + p.v); cls = p.v >= 0 ? 'wf-up' : 'wf-down'; lbl = `${sgnMoney(p.v)}`; nivel += p.v; }
    else { y0 = Y(p.v); y1 = T + H; cls = p.tipo === 'ini' ? 'wf-ini' : 'wf-fin'; lbl = fmtMoney(p.v); }
    const top = Math.min(y0, y1), alto = Math.max(2, Math.abs(y1 - y0));
    s += `<rect class="${cls} wf-bar" x="${x.toFixed(1)}" y="${top.toFixed(1)}" width="${bw.toFixed(1)}" height="${alto.toFixed(1)}" rx="4"/>`;
    if (i < n - 1) { const yn = Y(p.tipo === 'fx' ? nivel : p.v); s += `<line x1="${(x + bw).toFixed(1)}" x2="${((i + 1) * slot + (slot - bw) / 2).toFixed(1)}" y1="${yn.toFixed(1)}" y2="${yn.toFixed(1)}" class="wf-link"/>`; }
    s += `<text x="${cx.toFixed(1)}" y="${(top - 6).toFixed(1)}" text-anchor="middle" class="c-lbl ${p.tipo === 'fx' ? (p.v >= 0 ? 'wf-t-up' : 'wf-t-down') : ''}">${esc(lbl)}</text>`;
    if (p.tipo === 'fx') s += `<text x="${cx.toFixed(1)}" y="${(top + alto + 13).toFixed(1)}" text-anchor="middle" class="c-axis">${fmtDelta(p.v / d.ini)}</text>`;
    s += `<text x="${cx.toFixed(1)}" y="${T + H + 16}" text-anchor="middle" class="c-axis c-axis-b">${esc(p.l)}</text>`;
  });
  // Corte del eje: zigzag blanco sobre las barras de inicio y fin
  [0, n - 1].forEach(i => { const x = i * slot + (slot - bw) / 2; s += `<path d="M${(x - 2).toFixed(1)},${T + H - 14} l${(bw / 4 + 1).toFixed(1)},-5 l${(bw / 4).toFixed(1)},5 l${(bw / 4).toFixed(1)},-5 l${(bw / 4 + 1).toFixed(1)},5" class="wf-cut"/>`; });
  $('#fxChart').innerHTML = s + '</svg>';
  const ej = box.querySelector('.fx-eje'); if (ej) ej.textContent = 'Eje desde ' + fmtMoney(lo);
}

/** Texto del período de referencia: mes ('agosto') o período ('Abr–Jun 2026'). */
const mesRefTxt = pRef => /^\d{4}-\d{2}$/.test(pRef) ? perLabel(pRef).mes.toLowerCase() : String(pRef);
/* ---------- Campana de precios (métrica Precio) ----------
   Referencia = nivel superior de la selección ("capilaridad"): se quita el filtro más
   específico (cliente→su zona, zona, vendedor, producto→su marca en la categoría,
   marca, categoría). Cada operación se mide contra el precio promedio ponderado de
   su producto (línea) en el grupo de referencia; así total vs. total da 0 %.
   Modo "mes en curso" o "mes anterior completo" (cambia el mes de la referencia). */
function filtroActual() {
  const f = {}; for (const k in S.f) if (S.f[k] != null) f[k] = S.f[k];
  if (esVend()) f.vendedor = SES.usuario;
  return f;
}
function etiquetaFiltro(f) {
  const partes = [], t = (k, v) => Array.isArray(v) ? txtF(k, v) : k === 'zona' ? zonaCorta(v) : k === 'categoria' ? nomCat(v) : v;
  if (f.cliente) partes.push(t('cliente', f.cliente));
  else if (f.zona) partes.push(t('zona', f.zona));
  else if (f.vendedor) partes.push(esVend() && f.vendedor === SES.usuario ? 'Tu cartera' : t('vendedor', f.vendedor));
  if (f.marca) partes.push(t('marca', f.marca));
  if (f.categoria) partes.push(t('categoria', f.categoria));
  if (f.producto) partes.push(t('producto', f.producto));
  return partes.length ? partes.join(' · ') : 'Empresa';
}
/** Grupo de referencia: la selección sin su filtro más específico. */
function filtroPadre(f) {
  // Devuelve [filtro de referencia, dimensión que se quitó]
  const r = { ...f };
  if (r.cliente) { const c = Array.isArray(r.cliente) ? null : IDX.clienteInfo.get(r.cliente); delete r.cliente; if (c && !r.zona) r.zona = c.zona; return [r, 'cliente']; }
  if (r.zona) { delete r.zona; return [r, 'zona']; }
  if (r.vendedor) { delete r.vendedor; return [r, 'vendedor']; }
  if (r.producto) {
    const v = Array.isArray(r.producto) ? null : DATA.ventas.find(x => x.producto === r.producto && (!r.marca || enF(x.marca, r.marca)) && (!r.categoria || enF(x.categoria, r.categoria)));
    delete r.producto; if (v) { r.marca = r.marca || v.marca; r.categoria = r.categoria || v.categoria; }
    return [r, 'producto'];
  }
  if (r.marca) { delete r.marca; return [r, 'marca']; }
  if (r.categoria) { delete r.categoria; return [r, 'categoria']; }
  return [r, null];
}
const ventaEnFiltro = (v, f) => { for (const k in f) if (!enF(v[k], f[k])) return false; return true; };
function campanaPrecio(selIn, refIn) {
  const sel = selIn || filtroActual();
  let [ref, quitado] = filtroPadre(sel);
  if (refIn) { ref = refIn.f; quitado = refIn.quitado; }
  const prev = S.precioVs === 'prev';
  // Campana con "Mes anterior": la referencia es la MISMA selección (mismos filtros) en el mes anterior,
  // producto por producto. Ej.: marca CSL de este mes vs. CSL del mes anterior.
  if (prev && !refIn) { ref = { ...sel }; quitado = null; }
  // Geografía (cliente/zona/vendedor) o mismo grupo: producto por producto (efecto precio puro).
  // Producto/marca/categoría: precio por unidad contra el promedio del grupo superior.
  const porLinea = !['producto', 'marca', 'categoria'].includes(quitado);
  const clave = v => porLinea ? kLinea(v) : '*';
  const pRef = prev ? (esRango() ? lblPrev() : perAnterior(S.periodo)) : S.periodo;
  const refPers = new Set(prev ? perSelPrev() : perSel());
  const incluye = v => S.sim || v.origen !== 'manual';
  // Precio promedio ponderado por línea en el grupo de referencia
  const lin = new Map(), opsRef = [];
  for (const v of DATA.ventas) {
    if (!refPers.has(v._p) || !incluye(v) || !(v.precio > 0) || !ventaEnFiltro(v, ref)) continue;
    const k = clave(v), o = lin.get(k) || { f: 0, u: 0 }; o.f += v.unidades * v.precio; o.u += v.unidades; lin.set(k, o); opsRef.push(v);
  }
  const base = { sel, ref, pRef, prev, porLinea, lblSel: etiquetaFiltro(sel), lblRef: etiquetaFiltro(ref), mismo: JSON.stringify(sel) === JSON.stringify(ref) };
  if (opsRef.length < 3) return { ...base, vacio: true };
  const prom = k => { const o = lin.get(k); return o && o.u ? o.f / o.u : null; };
  // Distribución de la referencia (ponderada por unidades)
  const idx = [], pesos = [];
  opsRef.forEach(v => { idx.push(v.precio / prom(clave(v))); pesos.push(v.unidades); });
  const W = pesos.reduce((t, x) => t + x, 0);
  const mean = idx.reduce((t, x, i) => t + x * pesos[i], 0) / W;
  const sd = Math.max(0.004, Math.sqrt(idx.reduce((t, x, i) => t + pesos[i] * (x - mean) ** 2, 0) / W));
  // Selección del mes en curso, solo en líneas que existen en la referencia

/** Días hábiles del periodo (lun–vie sin feriados) y avance esperado a la fecha de corte. */
function calendario(periodo) {

    const iso = `${y}-${pad(m)}-${pad(d)}`;
    const w = dt.getUTCDay();
    if (w !== 0 && w !== 6 && !IDX.feriados.has(iso)) dias.push(iso);
  }

  const total = dias.length;
  const elapsed = periodo < cp ? total : periodo > cp ? 0 : dias.filter(x => x <= IDX.corte).length;

/* Barras que "se cargan" desde cero hasta su valor (crecimiento escalonado). */
let ultimaVista = '';
function animarBarras(root) {
  if (!root) return;
  const els = root.querySelectorAll('.pbar i, .fx-bar i, .abar-fill, .wf-bar, .c-bar, .c-bar-hi, .c-sim, .c-ghost, .ring-v, .g-fill');
  if (!els.length) return;
  const grupos = new Map();   // escalona dentro de cada gráfico o lista, no en toda la pantalla
  els.forEach(e => {
    const g = e.closest('svg:not(.ring svg), ul, .card') || root;
    const n = grupos.get(g) || 0; grupos.set(g, n + 1);
    e.style.animationDelay = Math.min(n, 14) * 45 + 'ms';
  });
  root.classList.remove('carga'); void root.offsetWidth; root.classList.add('carga');
  clearTimeout(root._tCarga);
  root._tCarga = setTimeout(() => root.classList.remove('carga'), 2200);
}

function render() {
  if (SIN_DATOS) { mostrarArchivo(); return; }
  if (!SES) { mostrarLogin(); return; }
  if (esVend() && S.tab === 'equipo') S.tab = 'inicio';
  if (esVend() && S.dimA === 'vendedor') S.dimA = 'marca';
  $('.tab[data-tab="equipo"]').hidden = esVend();
  renderHeader();
  renderCtx();
  const t = S.tab;
  $$('.tab').forEach(b => b.toggleAttribute('aria-current', false));
  $(`.tab[data-tab="${t}"]`).setAttribute('aria-current', 'page');
  ['inicio', 'analisis', 'equipo', 'mapa', 'datos'].forEach(k => { $('#scr-' + k).hidden = k !== t; });
  $('#ctx').hidden = t === 'datos';
  if (t === 'inicio') renderInicio();
  else if (t === 'analisis') renderAnalisis();
  else if (t === 'equipo') renderEquipo();
  else if (t === 'mapa') renderMapa();
  else renderDatos();
  ajustarBanda(); encabezadoScroll();
  // Animación de carga de barras: al entrar a una solapa o cambiar mes, métrica o filtros.
  const clave = [t, S.periodo, JSON.stringify(S.rango), S.metric, JSON.stringify(S.f), S.dimA].join('|');
  if (clave !== ultimaVista) { ultimaVista = clave; animarBarras($('#scr-' + t)); }
  store.set(KEY_UI, JSON.stringify({ metric: S.metric, dimA: S.dimA, orden: S.orden, sim: S.sim, vista: S.vista, detalle: S.detalle, agrup: S.agrup, evol: S.evol, fxVs: S.fxVs, precioVs: S.precioVs, apertura: S.apertura }));
}

/** Indicador blanco del selector Facturación / Cantidad / Precio: se desliza hasta la opción elegida. */
function moverIndicador() {
  const seg = $('#metricSeg'), ind = seg && seg.querySelector('.seg-ind'), b = seg && seg.querySelector('button[aria-pressed="true"]');
  if (!ind || !b || !b.offsetWidth) return;
  const W = seg.offsetWidth, H = seg.offsetHeight, c = b.offsetLeft + b.offsetWidth / 2;
  ind.style.transform = `translateX(${c - ind.offsetWidth / 2}px)`;
  const path = seg.querySelector('.mbar-bg path');
  if (path) {
    const r = 34, d = 29, k = 18, f = n => n.toFixed(1);
    const dd = `M${k},0 H${f(c - r - 6)} C${f(c - r + 6)},0 ${f(c - r * .62)},${d} ${f(c)},${d} C${f(c + r * .62)},${d} ${f(c + r - 6)},0 ${f(c + r + 6)},0 H${W - k} Q${W},0 ${W},${k} V${H - k} Q${W},${H} ${W - k},${H} H${k} Q0,${H} 0,${H - k} V${k} Q0,0 ${k},0 Z`;
    path.style.d = `path("${dd}")`; path.setAttribute('d', dd);
  }
}
/** Alto de la banda gris: llega hasta debajo del selector Facturación / Unidades / Precio. */

    <span class="grow"><b>${viejo ? 'Datos desactualizados' : 'Datos al ' + esc(fechaDia(IDX.corte))}</b><span>${viejo ? 'Última venta ' + esc(cuando) + ' (' + esc(fechaDia(IDX.corte)) + ')' : 'Última venta ' + esc(cuando)}${esc(carg)}</span></span>

function gaugeSVG(t, marker) {
  const W = 260, cx = 130, cy = 132, r = 108, sw = 18;
  const pt = u => { const ang = Math.PI * (1 - u); return [cx + r * Math.cos(ang), cy - r * Math.sin(ang)]; };
  const arc = (u0, u1) => { const [x0, y0] = pt(u0), [x1, y1] = pt(u1); return `M${x0.toFixed(2)},${y0.toFixed(2)} A${r},${r} 0 0 1 ${x1.toFixed(2)},${y1.toFixed(2)}`; };
  const tt = Math.max(0, Math.min(1, t));
  let s = `<svg viewBox="0 0 ${W} 146" role="img" aria-hidden="true">`;
  s += `<path d="${arc(0, 1)}" stroke="var(--hero-track)" stroke-width="${sw}" fill="none" stroke-linecap="round"/>`;
  if (tt > 0.003) s += `<path class="g-fill" pathLength="100" d="${arc(0, tt)}" stroke="var(--hero-fill)" stroke-width="${sw}" fill="none" stroke-linecap="round"/>`;
  if (marker != null) {
    const ang = Math.PI * (1 - Math.max(0, Math.min(1, marker)));
    const x0 = cx + (r - 15) * Math.cos(ang), y0 = cy - (r - 15) * Math.sin(ang);
    const x1 = cx + (r + 15) * Math.cos(ang), y1 = cy - (r + 15) * Math.sin(ang);
    s += `<line x1="${x0.toFixed(1)}" y1="${y0.toFixed(1)}" x2="${x1.toFixed(1)}" y2="${y1.toFixed(1)}" stroke="var(--accent)" stroke-width="7" stroke-linecap="round"/>`;
    s += `<line x1="${x0.toFixed(1)}" y1="${y0.toFixed(1)}" x2="${x1.toFixed(1)}" y2="${y1.toFixed(1)}" stroke="var(--hero-ink)" stroke-width="3" stroke-linecap="round"/>`;
  }
  return s + '</svg>';
}

function heroHTML(a, cal, e) {
  const m = S.metric;
  if (m === 'precio') return heroPrecioHTML(a, cal, e);
  const dotCol = { good: 'var(--good)', warn: 'var(--warn)', bad: 'var(--bad)', neu: 'var(--hero-muted)' }[e.estado.k];
  const pillH = `<span class="hero-pill"><span class="dot" style="background:${dotCol}"></span>${esc(e.estado.t)}</span>`;
  let big, sub, t, marker, stats, foot;
  if (m === 'precio') {
    const r = e.ratio;
    big = r == null ? '—' : NF1.format(r * 100) + '<small>%</small>';
    sub = 'Precio logrado vs. objetivo';
    t = r == null ? 0 : (r - 0.9) / 0.2; marker = 0.5;
    stats = [['Precio real', e.real == null ? '—' : fmtMoneyFull(e.real)], ['Precio objetivo', e.obj == null ? '—' : fmtMoneyFull(e.obj)], ['Desvío', r == null ? '—' : fmtDelta(r - 1)]];
    foot = '<span class="mk"></span>Marca = 100% del precio objetivo · escala 90–110%';
  } else {
    const r = e.ratio;
    big = r == null ? '—' : NF1.format(r * 100) + '<small>%</small>';
    sub = 'Cumplimiento de ' + (m === 'fact' ? 'facturación' : 'cantidad');
    t = r || 0;
    const pr = proyeccionSel(S.f, m, a, cal);
    marker = cal.closed ? 1 : pr && e.obj ? Math.min(1, pr.fin / e.obj) : null;
    const rp = esRango() ? realPrevSel(S.f, m) : 0;
    stats = [['Vendido', fmtMetric(e.real)], ['Objetivo', fmtMetric(e.obj)],
      esRango() ? ['Vs. ' + lblPrev(), rp ? fmtDelta(e.real / rp - 1) : '—'] : [cal.closed ? 'Días hábiles' : 'Proyección', cal.closed ? String(cal.total) : pr ? fmtMetric(pr.fin) : '—']];
    foot = cal.future ? 'El mes todavía no empezó.'
      : cal.closed ? `<span class="mk"></span>Marca = 100% del objetivo${esRango() ? ' · ' + esc(lblPrev()) + ' a la misma fecha: ' + fmtMetric(rp) : ''}${r == null ? '' : ' · ' + fmtPP(r - 1) + ' vs. objetivo'}`
      : pr ? `<span class="mk"></span>Marca = proyección de cierre${e.obj ? ' · ' + fmtPct(pr.fin / e.obj, 0) + ' del objetivo' : ''} · ${pr.metodo === 'historia' ? 'según los últimos ' + pr.meses + ' meses' : 'lineal (sin historia)'}` : '';
  }
  return `<div class="hero">
    <div class="hero-top"><span class="hero-lbl">${esc(METRIC_NAME[m])} · ${esc(lblSel())}</span>${pillH}</div>
    <div class="gauge">${gaugeSVG(t, marker)}<div class="gauge-c"><div class="gauge-v">${big}</div><div class="gauge-s">${sub}</div></div></div>
    <div class="hero-stats">${stats.map(([l, v]) => `<div><span>${l}</span><b>${v}</b></div>`).join('')}</div>
    <div class="hero-foot">${foot}</div>
    ${a.mN && m !== 'precio' ? `<div class="hero-foot" style="margin-top:6px"><span class="mk" style="background:#F2C27A"></span>Incluye simulación: +${m === 'fact' ? fmtMoney(a.mF) : fmtUc(a.mU)} (${a.mN} registro${a.mN > 1 ? 's' : ''} manual${a.mN > 1 ? 'es' : ''})</div>` : ''}
  </div>`;
}

function kpiHTML(icon, v, l, d) {
  return `<div class="kpi"><div class="kpi-i">${ico(icon)}</div><div class="kpi-v">${v}</div><div class="kpi-l">${l}</div>${d ? `<div class="kpi-d">${d}</div>` : ''}</div>`;
}
function kpisHTML(a, cal) {
  const m = S.metric;
  const eF = evalua(a, cal, 'fact'), eU = evalua(a, cal, 'unid'), eP = evalua(a, cal, 'precio');
  const tiles = [];
  const proyTile = (e, mm) => {
    if (cal.closed) return kpiHTML('flag', fmtMetric(e.real - e.obj, mm), 'Brecha final vs. objetivo', fmtPct(e.ratio) + ' logrado');
    if (!cal.elapsed) return kpiHTML('trend', '—', 'Proyección de cierre', 'Sin ventas aún');
    const pr = proyeccionSel(S.f, mm, agg(SEL, S.f), cal), proy = pr ? pr.fin : e.real;
    return kpiHTML('trend', fmtMetric(proy, mm), 'Proyección de cierre', fmtPct(e.obj ? proy / e.obj : null) + ' del objetivo');
  };
  const faltaTile = (e, mm) => {
    const falta = Math.max(0, e.obj - e.real);
    if (cal.closed) return kpiHTML('clock', String(cal.total), 'Días hábiles del mes', 'Mes cerrado');
    const porDia = cal.restantes ? falta / cal.restantes : falta;
    return kpiHTML('target', fmtMetric(falta, mm), 'Falta para el objetivo', (cal.restantes ? fmtMetric(porDia, mm) + ' por día hábil' : 'Último día hábil'));
  };
  if (m === 'fact') {
    tiles.push(proyTile(eF, 'fact'), faltaTile(eF, 'fact'));
    tiles.push(kpiHTML('box', fmtUc(eU.real), 'Cantidad vendida', fmtPct(eU.ratio) + ' del objetivo'));
    tiles.push(kpiHTML('tag', eP.real == null ? '—' : fmtMoneyFull(eP.real), 'Precio promedio', eP.ratio == null ? '—' : fmtDelta(eP.ratio - 1) + ' vs. objetivo'));
  } else if (m === 'unid') {
    tiles.push(proyTile(eU, 'unid'), faltaTile(eU, 'unid'));
    tiles.push(kpiHTML('money', fmtMoney(eF.real), 'Facturación', fmtPct(eF.ratio) + ' del objetivo'));
    tiles.push(kpiHTML('tag', eP.real == null ? '—' : fmtMoneyFull(eP.real), 'Precio promedio', eP.ratio == null ? '—' : fmtDelta(eP.ratio - 1) + ' vs. objetivo'));
  } else {
    const efecto = a.rF - a.rFo;
    const porCli = [...aggPorDim(SEL, 'cliente', S.f).values()].filter(x => x.rFo > 0);
    const bajo = porCli.filter(x => x.rF / x.rFo < 0.975).length;
    const porSku = [...aggPorDim(SEL, 'sku', S.f).values()].filter(x => x.rFo > 0);
    const bajoS = porSku.filter(x => x.rF / x.rFo < 0.975).length;
    tiles.push(kpiHTML('money', sgnMoney(efecto), 'Efecto precio en $', 'Real vs. precio objetivo'));
    tiles.push(kpiHTML('store', `${bajo} de ${porCli.length}`, 'Clientes bajo precio', 'Desvío peor a −2,5%'));
    tiles.push(kpiHTML('box', `${bajoS} de ${porSku.length}`, 'Productos bajo precio', 'Desvío peor a −2,5%'));
    tiles.push(kpiHTML('trend', fmtMoney(eF.real), 'Facturación', fmtPct(eF.ratio) + ' del objetivo'));
  }
  // Utilidad bruta: solo aprobador y solo si el archivo trae costos.
  if (!esVend() && IDX.conCostos && a.rFc > 0) {
    const ub = a.rFc - a.rC;
    tiles.push(kpiHTML('money', fmtMoney(ub), 'Utilidad bruta', 'UB ' + fmtPct(ub / a.rFc) + ' · solo aprobador'));
  }
  if (a.bmN > 0 || (!esVend() && IDX.conCostos && a.rFc > 0)) {
    tiles.push(kpiHTML('alert', String(a.bmN), 'Ventas bajo precio mínimo', a.bmN ? fmtMoney(a.bmF) + ' facturados' : 'Ninguna en el periodo'));
  }
  return `<div class="kpis">${tiles.join('')}</div>`;
}

/* ---------- Gráfico: ventas diarias ---------- */
function barPath(x, y, w, h, r) {
  if (h <= 0.5) return '';
  r = Math.min(r, w / 2, h);
  return `M${x},${y + h}V${y + r}A${r},${r} 0 0 1 ${x + r},${y}H${x + w - r}A${r},${r} 0 0 1 ${x + w},${y + r}V${y + h}Z`;
}
function roundRect(x, y, w, h, r) {
  if (h <= 0.5) return '';
  r = Math.min(r, w / 2, h / 2);
  return `M${x + r},${y}H${x + w - r}A${r},${r} 0 0 1 ${x + w},${y + r}V${y + h - r}A${r},${r} 0 0 1 ${x + w - r},${y + h}H${x + r}A${r},${r} 0 0 1 ${x},${y + h - r}V${y + r}A${r},${r} 0 0 1 ${x + r},${y}Z`;
}
function niceTicks(lo, hi, n) {
  const span = hi - lo; if (span <= 0) return [lo];
  const step0 = span / n, mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const step = [1, 2, 2.5, 5, 10].map(k => k * mag).find(k => span / k <= n) || 10 * mag;
  const out = []; for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(v);
  return out;
}
function axisFmt(v, m) {
  if (m === 'unid') return !v ? '0' : Math.abs(v) >= 1000 ? NF0.format(v / 1000) + 'k' : NF0.format(v);
  if (m === 'precio') return '$' + NF0.format(v);
  if (!v) return '$0';
  return Math.abs(v) >= 1e6 ? '$' + NF0.format(v / 1e6) + 'M' : '$' + NF0.format(v / 1e3) + 'k';
}

/* ---------- Normalización y validación de archivos ---------- */
const sinAcento = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[\s_-]/g, '');
const ALIAS = {
  periodo: ['periodo', 'mes', 'period'], fecha: ['fecha', 'dia', 'date'], zona: ['zona', 'region'], vendedor: ['vendedor', 'ejecutivo', 'seller'],
  cliente: ['cliente', 'customer'], marca: ['marca', 'brand'], producto: ['producto', 'sku', 'articulo', 'product'],
  unidades: ['unidades', 'cantidad', 'cant', 'units', 'qty'], precio: ['precio', 'precioneto', 'preciounitario', 'price'], id: ['id'], origen: ['origen'],
};
function campo(row, name) {
  const keys = Object.keys(row);
  for (const al of ALIAS[name]) { const k = keys.find(x => sinAcento(x) === al); if (k != null) return row[k]; }
  return undefined;
}
function aNum(v) {
  if (typeof v === 'number') return v;
  if (v == null) return NaN;

/* Guarda un archivo: en el APK (Capacitor) usa Filesystem; publicado en claude.ai usa
   la capacidad "downloads"; en un navegador común, descarga directa. */
let DESCARGAS = null;
try { if (window.claude && typeof window.claude.use === 'function') window.claude.use('downloads').then(ns => { DESCARGAS = ns; }, () => {}); } catch (e) { /* sin runtime de claude.ai */ }
async function guardarArchivo(nombre, texto) {
  if (DESCARGAS) {
    try { await DESCARGAS.save({ filename: nombre, data: new Blob([texto], { type: 'application/json' }) }); toast('Archivo guardado: ' + nombre); return true; }
    catch (e) { toast(e && e.code === 'declined' ? 'Descarga cancelada' : 'No se pudo descargar. Usá "Copiar JSON".'); return false; }
  }
  const Cap = window.Capacitor;
  if (Cap && Cap.isNativePlatform && Cap.isNativePlatform()) {
    // Dentro del APK: el WebView no descarga archivos, se guardan en Documentos.
    try {
      await Cap.Plugins.Filesystem.writeFile({ path: nombre, data: texto, directory: 'DOCUMENTS', encoding: 'utf8' });
      toast('Guardado en Documentos/' + nombre);
      return true;
    } catch (e) { toast('No se pudo guardar el archivo. Usá "Copiar JSON".'); return false; }
  }
  try {
    const url = URL.createObjectURL(new Blob([texto], { type: 'application/json' }));
    const a = document.createElement('a');
    a.href = url; a.download = nombre; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    toast('Descargando ' + nombre);
    return true;
  } catch (e) { toast('No se pudo descargar. Usá "Copiar JSON".'); return false; }
}

  openSheet(ed ? 'Editar registro manual' : 'Nuevo registro manual', ed ? 'Simulación · ' + fechaDia(ed.fecha) : 'Simulá una venta para ver cómo mejora el estado', body, sh => {
    const vV = $('#vVend', sh), vC = $('#vCli', sh), vM = $('#vMarca', sh), vP = $('#vProd', sh), vU = $('#vUni', sh), vPr = $('#vPrecio', sh), vF = $('#vFecha', sh);
    const precioRef = () => {

      const l = lineaSel(); if (!l) return null;
      const zona = (IDX.clienteInfo.get(vC.value) || {}).zona;
      let po = IDX.precioObj.get([p, vC.value, l.marca, l.producto].join('|'));
      if (po == null && l.calidad) po = IDX.precioObj.get([p, zona, kProdC(l)].join('|'));
      if (po == null) po = IDX.precioObj.get([p, zona, kProd(l)].join('|'));
      if (po == null) { const o = DATA.objetivos.filter(o => o.marca === l.marca && o.producto === l.producto && (o.categoria || '') === (l.categoria || '')).sort((a, b) => b.periodo.localeCompare(a.periodo))[0]; po = o ? o.precio : null; }
      return po;
    };
    const syncCli = (pref) => {
      const propios = cli.filter(c => (IDX.clienteInfo.get(c) || {}).vendedor === vV.value);
      const lista = propios.length ? propios : cli;
      const prev = pref || vC.value;

    };
    const lineaSel = () => IDX.lineas.find(l => kLinea(l) === vP.value);
    const syncProd = (pref) => {
      const ls = IDX.lineas.filter(l => l.marca === vM.value);

    vC.onchange = syncPrecio; vM.onchange = () => { syncProd(); syncPrecio(); }; vP.onchange = syncPrecio; vF.onchange = syncPrecio;
    vU.oninput = calc; vPr.oninput = calc;

      if (ed) DATA.ventas[DATA.ventas.indexOf(ed)] = v; else DATA.ventas.push(v);

      S.selDia = f; S.sim = true;
      guardar();

      render();

function borrarManual(id) {
  const v = DATA.ventas.find(x => x.id === id && esManual(x));
  if (!v || !enScope(v)) return;
  closeSheet();
  setTimeout(() => sheetConfirmar('Eliminar registro', `${v.cliente} · ${v.marca} ${v.producto} · ${fmtU(v.unidades)} del ${fechaDia(v.fecha)}.`, 'Eliminar', () => {

}

  const pers = [...new Set([...data.objetivos.map(o => o.periodo), ...data.ventas.map(v => v.fecha.slice(0, 7))])].sort();
  const body = `<div class="facts" style="margin-top:0"><div style="background:var(--surface)"><b>${fmtInt(data.objetivos.length)}</b><span>objetivos</span></div><div style="background:var(--surface)"><b>${fmtInt(data.ventas.length)}</b><span>ventas</span></div><div style="background:var(--surface)"><b>${pers.length}</b><span>${pers.length ? esc(perLabel(pers[0]).corto + '–' + perLabel(pers[pers.length - 1]).corto) : 'meses'}</span></div></div>
    ${errores.length ? `<div class="warnbox">${errores.length} fila${errores.length > 1 ? 's' : ''} descartada${errores.length > 1 ? 's' : ''}:<ul>${errores.slice(0, 5).map(e => `<li>${esc(e)}</li>`).join('')}${errores.length > 5 ? `<li>… y ${errores.length - 5} más</li>` : ''}</ul></div>` : ''}
    ${avisos.length ? `<div class="warnbox">Revisá la cartera: cada cliente y cada zona deben tener un solo vendedor.<ul>${avisos.slice(0, 5).map(e => `<li>${esc(e)}</li>`).join('')}${avisos.length > 5 ? `<li>… y ${avisos.length - 5} más</li>` : ''}</ul></div>` : ''}
    ${data.usuarios ? `<p class="card-s" style="margin:10px 0 0">Trae ${data.usuarios.length} usuarios: reemplazan a los actuales.</p>` : ''}
    <div class="btns">${data.raw ? '' : '<button class="btn btn-p" id="impComb">Combinar con los datos actuales</button>'}<button class="btn btn-d" id="impRepl">Reemplazar todo</button></div>
    <p class="card-s" style="text-align:center;margin-top:12px">Combinar: los objetivos del archivo reemplazan los de esos meses y las ventas se suman sin duplicar ids. En los dos casos los registros manuales se conservan.</p>`;
  openSheet('Cargar ' + nombre, 'Revisá el contenido antes de aplicarlo', body, sh => {
    $('#impRepl', sh).onclick = () => {
      if (!data.objetivos.length) { toast('El archivo no trae objetivos: usá "Combinar".'); return; }
      closeSheet(); aplicarDatos(data, nombre); toast('Datos reemplazados');
    };
    if ($('#impComb', sh)) $('#impComb', sh).onclick = () => {
      const base = limpio(DATA, false);
      const persObj = new Set(data.objetivos.map(o => o.periodo));
      const objetivos = base.objetivos.filter(o => !persObj.has(o.periodo)).concat(data.objetivos);
      const byId = new Map(base.ventas.map(v => [v.id, v]));
      data.ventas.forEach(v => byId.set(v.id, v));
      const act = [base.meta.actualizado, data.meta.actualizado].filter(Boolean).sort().pop() || '';
      const meta = { ...base.meta, actualizado: act, feriados: [...new Set([...(base.meta.feriados || []), ...data.meta.feriados])].sort() };
      if (data.meta.empresa) meta.empresa = data.meta.empresa;
      closeSheet();
      aplicarDatos({ meta, usuarios: data.usuarios || base.usuarios, objetivos, ventas: [...byId.values()].sort((a, b) => a.fecha.localeCompare(b.fecha)) }, nombre + ' (combinado)');
      toast(`Combinado: ${fmtInt(data.ventas.length)} ventas y ${fmtInt(data.objetivos.length)} objetivos`);
    };
  });
}

$('#fileInput').addEventListener('change', ev => {
  const file = ev.target.files && ev.target.files[0];
  ev.target.value = '';
  if (!file) return;
  const rd = new FileReader();
  const fallo = msg => SIN_DATOS ? (ARCH_ERR = msg, mostrarArchivo()) : openSheet('No se pudo leer el archivo', file.name, `<div class="warnbox" style="margin-top:0">${esc(msg)}</div>`);
  rd.onload = async () => {
    let raw;
    try { raw = JSON.parse(String(rd.result).replace(/^﻿/, '')); }
    catch (e) { return fallo(/\.xlsx?$/i.test(file.name) ? 'Elegiste el Excel. La app lee el archivo pulso_datos.json que genera el conversor.' : 'El archivo no es un JSON válido.'); }
    try {
      if (esCifrado(raw)) {
        toast('Descifrando datos…');
        const res = normalizar(await descifrarDatos(raw));
        if (!res.data.objetivos.length) throw new Error('El archivo no trae objetivos.');
        res.data.meta._cargado = new Date().toISOString();
        SIN_DATOS = false; ARCH_ERR = '';
        aplicarDatos(res.data, 'OneDrive');
        toast('Datos actualizados al ' + fechaDia(IDX.corte));
        return;
      }
      // Archivos sin cifrar: solo el aprobador (revisión o pruebas). En la versión web pública, nunca.
      if (SIN_DEMO) throw new Error('Este no es el archivo oficial. Elegí pulso_datos.json (el que genera el conversor) en la carpeta de OneDrive.');
      if (esVend()) throw new Error('Este no es el archivo oficial. Elegí pulso_datos.json en la carpeta de OneDrive.');
      const res = normalizar(raw);
      if (!res.data.objetivos.length && !res.data.ventas.length) throw new Error('Ninguna fila es válida.');
      sheetImport(file.name, res);
    } catch (e) { fallo(e.message); }
  };
  rd.onerror = () => toast('No se pudo abrir el archivo');
  rd.readAsText(file);
});
let rT;
window.addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(() => { if (S.tab === 'inicio') renderInicio(); }, 150); });

/* Botón "atrás" de Android (solo dentro del APK, con el plugin @capacitor/app):
   cierra la hoja abierta, vuelve a Inicio y, desde Inicio, sale de la app. */
(function botonAtras() {
  try {
    const App = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App;
    if (!App || typeof App.addListener !== 'function') return;
    App.addListener('backButton', () => {
      if (!$('#login').hidden) { if (LOGIN.paso !== 'rol') { LOGIN.paso = LOGIN.paso === 'clave' && usuarios().filter(u => u.rol === LOGIN.rol).length > 1 ? 'usuario' : 'rol'; mostrarLogin(); } else App.exitApp(); return; }
      if (!$('#sheetWrap').hidden) { closeSheet(); return; }
      if (S.tab !== 'inicio') { S.tab = 'inicio'; render(); window.scrollTo({ top: 0 }); return; }
      App.exitApp();
    });
  } catch (e) { /* fuera del APK no hace nada */ }
})();

(function init() {
  try { const ui = JSON.parse(store.get(KEY_UI) || '{}'); if (typeof ui.sim === 'boolean') S.sim = ui.sim; if (METRIC_NAME[ui.metric]) S.metric = ui.metric; if (DIMS_A[ui.dimA]) S.dimA = ui.dimA; if (ORDENES[ui.orden]) S.orden = ui.orden; if (ui.vista === 'acum' || ui.vista === 'obj') S.vista = ui.vista; if (typeof ui.detalle === 'boolean') S.detalle = ui.detalle; if (['dia', 'semana'].includes(ui.agrup)) S.agrup = ui.agrup; if (['total', 'categoria', 'marca'].includes(ui.evol)) S.evol = ui.evol; if (['obj', 'prev'].includes(ui.fxVs)) S.fxVs = ui.fxVs; if (['curso', 'prev'].includes(ui.precioVs)) S.precioVs = ui.precioVs; if (Array.isArray(ui.apertura)) S.apertura = ui.apertura; } catch (e) { /* preferencias por defecto */ }
  let d = null, origen = 'Demo';
  try {
    const raw = store.get(KEY_DATA);
    if (raw) { const p = JSON.parse(raw); const res = normalizar(p); if (res.data.objetivos.length || res.data.ventas.length) { d = res.data; origen = (p.meta && p.meta._origen) || 'Datos guardados'; if (!esV2(p)) d.ventas.forEach((v, i) => { const o = p.ventas[i]; if (o && o.origen) v.origen = o.origen; }); } }
  } catch (e) { d = null; }
  if (!d && SIN_DEMO) { SIN_DATOS = true; DATA = { meta: { _origen: 'Sin datos' }, usuarios: [], objetivos: [], ventas: [], maestros: {} }; render(); return; }
  DATA = d || normalizar(generarDemo()).data;
  DATA.meta._origen = origen;
  buildIndex();
  try { const ses = JSON.parse(store.get(KEY_SES) || 'null'); if (ses && usuarios().some(u => u.usuario === ses.usuario && u.rol === ses.rol)) SES = { rol: ses.rol, usuario: ses.usuario }; } catch (e) { SES = null; }
  const cp = IDX.corte.slice(0, 7);
  S.periodo = IDX.periodos.includes(cp) ? cp : IDX.periodos[IDX.periodos.length - 1]; S.rango = null;
  render();
})();

</script>

(function () {

    reg.addEventListener('updatefound', function () {
      var w = reg.installing; if (!w) return;
      w.addEventListener('statechange', function () {
        if (w.state === 'installed' && navigator.serviceWorker.controller) {
          var b = document.createElement('button'); b.className = 'pwa-upd'; b.textContent = 'Hay una versión nueva · tocá para actualizar';
          b.onclick = function () { w.postMessage('activar'); }; document.body.appendChild(b);
        }
      });
    });
    setInterval(function () { reg.update(); }, 60 * 60 * 1000);
  }).catch(function () {});
  var recargando = false;
  navigator.serviceWorker.addEventListener('controllerchange', function () { if (!recargando) { recargando = true; location.reload(); } });
  // iPhone / iPad en Safari, sin instalar: cómo agregarla a la pantalla de inicio (se muestra hasta que la cierran)
  var ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var instalada = window.navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
  var visto = false; try { visto = localStorage.getItem('pulso.pwaTip') === '1'; } catch (e) {}
  if (ios && !instalada && !visto) setTimeout(function () {

    d.querySelector('button').onclick = function () { d.remove(); try { localStorage.setItem('pulso.pwaTip', '1'); } catch (e) {} };
    document.body.appendChild(d);
  }, 2500);
})();
